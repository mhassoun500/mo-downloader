# Builds MO Downloader for Windows and macOS on GitHub.
# Run it from the "Actions" tab -> "Build MO Downloader" -> "Run workflow",
# or push a tag like v2.3 to also publish a Release with the files attached.
name: Build MO Downloader

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # Windows 10/11 x64 -> installer
          - os: macos-latest     # Apple Silicon Macs (M1/M2/M3/M4)
          - os: macos-15-intel   # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get aria2 (Windows, official build, checksum pinned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\aria2.zip"
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288") { throw "aria2 checksum mismatch: $h" }
          Expand-Archive $zip "$env:RUNNER_TEMP\aria2"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\aria2" -Recurse -Filter aria2c.exe).FullName
          & $exe --version | Select-Object -First 1
          "MO_ARIA2C=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get aria2 (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install aria2
          echo "MO_ARIA2C=$(brew --prefix)/bin/aria2c" >> "$GITHUB_ENV"
          "$(brew --prefix)/bin/aria2c" --version | head -1

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build
        run: python build-kit/build.py

      - name: Check bundled aria2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "build-tmp\dist\MO Downloader\_internal\aria2\aria2c.exe" --version | Select-Object -First 1

      - name: Check bundled aria2 runs without Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          A="build-tmp/dist/MO Downloader.app/Contents/Frameworks/aria2/aria2c"
          otool -L "$A"
          if otool -L "$A" | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)"; then echo "aria2 still points at Homebrew libraries"; exit 1; fi
          brew uninstall --ignore-dependencies aria2 || true
          "$A" --version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: MO-Downloader-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
