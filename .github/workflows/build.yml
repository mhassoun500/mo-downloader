# Builds MO Downloader for Windows and macOS on GitHub.
# Run it from the "Actions" tab -> "Build MO Downloader" -> "Run workflow",
# or push a tag like v2.3 to also publish a Release with the files attached.
name: Build MO Downloader

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # Windows 10/11 x64 -> installer
          - os: macos-latest     # Apple Silicon Macs (M1/M2/M3/M4)
          - os: macos-15-intel   # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get aria2 (Windows, official build, checksum pinned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\aria2.zip"
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288") { throw "aria2 checksum mismatch: $h" }
          Expand-Archive $zip "$env:RUNNER_TEMP\aria2"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\aria2" -Recurse -Filter aria2c.exe).FullName
          & $exe --version | Select-Object -First 1
          "MO_ARIA2C=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get aria2 (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install aria2
          echo "MO_ARIA2C=$(brew --prefix)/bin/aria2c" >> "$GITHUB_ENV"
          "$(brew --prefix)/bin/aria2c" --version | head -1

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Get Microsoft WebView2 bootstrapper (Windows; bundled in the installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $f
          $sig = Get-AuthenticodeSignature $f
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Microsoft") { throw "unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          "MO_WEBVIEW2_SETUP=$f" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $f /silent /install | Out-Null

      - name: Build
        run: python build-kit/build.py

      - name: Check bundled aria2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "build-tmp\dist\MO Downloader\_internal\aria2\aria2c.exe" --version | Select-Object -First 1

      - name: Check bundled aria2 runs without Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          A="build-tmp/dist/MO Downloader.app/Contents/Frameworks/aria2/aria2c"
          otool -L "$A"
          if otool -L "$A" | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)"; then echo "aria2 still points at Homebrew libraries"; exit 1; fi
          brew uninstall --ignore-dependencies aria2 || true
          "$A" --version | head -1
          # Simulate a Mac without Homebrew: hide Homebrew's OpenSSL modules, then download over HTTPS
          # with only the copy shipped inside the app (this is exactly how the app starts aria2).
          M="build-tmp/dist/MO Downloader.app/Contents/Frameworks/aria2/ossl-modules"
          ls -la "$M"
          OSSL="$(brew --prefix openssl@3)/lib/ossl-modules"
          sudo mv "$OSSL" "$OSSL.hidden"
          mkdir -p "$RUNNER_TEMP/a2"
          U=https://raw.githubusercontent.com/aria2/aria2/master/README.rst
          echo "-- without the bundled module (expected to fail like on a Mac without Homebrew):"
          "$A" --no-conf --dir="$RUNNER_TEMP/a2" --out=without.txt "$U" 2>&1 | tail -3 || true
          echo "-- with the bundled module (how the app runs it):"
          OPENSSL_MODULES="$M" "$A" --no-conf --dir="$RUNNER_TEMP/a2" --out=with.txt -x4 -s4 "$U"
          test -s "$RUNNER_TEMP/a2/with.txt"
          echo "aria2 HTTPS download OK with the bundled OpenSSL module"
          sudo mv "$OSSL.hidden" "$OSSL"

      - name: Self-test the app window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MO_SELFTEST = "$env:RUNNER_TEMP\selftest.txt"; $env:MD_PORT = "8899"
          $p = Start-Process -FilePath "build-tmp\dist\MO Downloader\MO Downloader.exe" -PassThru
          $p | Wait-Process -Timeout 150 -ErrorAction SilentlyContinue
          if (!$p.HasExited) { $p.Kill() }
          if (Test-Path $env:MO_SELFTEST) { Get-Content $env:MO_SELFTEST } else { Get-Content "$env:USERPROFILE\.media_downloader\log.txt" -Tail 40; throw "no self-test result" }
          if (-not (Select-String -Path $env:MO_SELFTEST -Pattern "^OK")) { Get-Content "$env:USERPROFILE\.media_downloader\log.txt" -Tail 40; throw "window self-test failed" }
          if (-not (Select-String -Path $env:MO_SELFTEST -Pattern "tray=OK")) { Get-Content "$env:USERPROFILE\.media_downloader\log.txt" -Tail 40; throw "no icon next to the clock" }
          $k = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.mo.downloader"
          if (-not (Test-Path $k)) { throw "browser helper not registered" }
          $m = (Get-ItemProperty $k)."(default)"; Get-Content $m

      - name: Self-test the app window (macOS)
        if: runner.os == 'macOS'
        run: |
          export MO_SELFTEST="$RUNNER_TEMP/selftest.txt" MD_PORT=8899
          "build-tmp/dist/MO Downloader.app/Contents/MacOS/MO Downloader" & PID=$!
          for i in $(seq 1 150); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          if [ -f "$MO_SELFTEST" ]; then cat "$MO_SELFTEST"; else tail -40 ~/.media_downloader/log.txt; exit 1; fi
          grep -q "^OK" "$MO_SELFTEST" || { tail -40 ~/.media_downloader/log.txt; exit 1; }
          grep -q "tray=OK" "$MO_SELFTEST" || { echo "no menu-bar icon"; tail -40 ~/.media_downloader/log.txt; exit 1; }
          grep -q "reopen=OK" "$MO_SELFTEST" || { echo "clicking the Dock icon did not bring the window back"; exit 1; }

      - name: Browser helper (native messaging) answers and starts the app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP="build-tmp/dist/MO Downloader/MO Downloader.exe";
          else APP="build-tmp/dist/MO Downloader.app/Contents/MacOS/MO Downloader"; fi
          python - "$APP" <<'PY'
          import json, struct, subprocess, sys, time, urllib.request
          app = sys.argv[1]
          def ask(t):
              raw = json.dumps({"type": t}).encode()
              p = subprocess.run([app, "chrome-extension://kfiopiphhapdnaeibmhmdloghbnheeoo/"], input=struct.pack("<I", len(raw)) + raw,
                                 capture_output=True, timeout=90)
              n = struct.unpack("<I", p.stdout[:4])[0]
              return json.loads(p.stdout[4:4 + n])
          r = ask("ping"); print("ping (app closed):", r); assert r["app"] == "MO Downloader" and not r["port"]
          r = ask("launch"); print("launch:", r); assert r["port"], "the helper did not start the app"
          o = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          print(o.open(f"http://127.0.0.1:{r['port']}/api/ping", timeout=5).read())
          o.open(urllib.request.Request(f"http://127.0.0.1:{r['port']}/api/shutdown", data=b"{}",
                 headers={"X-MO-Ext": "1", "Content-Type": "application/json"}), timeout=10)
          time.sleep(3)
          PY

      - name: Check the bundled engines (yt-dlp, gallery-dl, browser impersonation)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP="build-tmp/dist/MO Downloader/MO Downloader.exe";
          else APP="build-tmp/dist/MO Downloader.app/Contents/MacOS/MO Downloader"; fi
          "$APP" --engine-check "$RUNNER_TEMP/engines.json" || true
          cat "$RUNNER_TEMP/engines.json"
          python - "$RUNNER_TEMP/engines.json" <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1]))
          assert e["yt_dlp"], "yt-dlp missing"
          assert e["gallery_dl"], "gallery-dl missing from the build"
          assert e["impersonate"], "curl-cffi (browser impersonation) missing from the build"
          assert e["ffmpeg"], "ffmpeg missing"
          print("engines OK:", e)
          PY
          MO_GDL_OUT="$RUNNER_TEMP/gdl.txt" "$APP" --gallery-dl --version || true
          cat "$RUNNER_TEMP/gdl.txt"; grep -E "^[0-9]+\.[0-9]+" "$RUNNER_TEMP/gdl.txt"

      - name: YouTube above 720p (information only; GitHub's servers are often asked to "confirm you're not a bot")
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --quiet "yt-dlp[default,curl-cffi]" yt-dlp-ejs
          python - <<'PY'
          import yt_dlp
          with yt_dlp.YoutubeDL({"quiet": True, "skip_download": True}) as y:
              info = y.extract_info("https://www.youtube.com/watch?v=aqz-KE-bpKQ", download=False)
          h = max((f.get("height") or 0) for f in info["formats"])
          print("highest YouTube quality offered:", h)
          assert h > 720, "only up to %sp offered" % h
          PY

      # On a version tag the files go straight onto the Release (no storage quota there)
      - name: Attach the files to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: MO-Downloader-${{ matrix.os }}
          retention-days: 7   # old builds expire so the storage quota is not hit again
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  tests:
    # end-to-end tests against a local test site: attempt chain, impersonation, gallery engine, live recording,
    # caught streams, error report (tests/run_tests.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python -m pip install --quiet "yt-dlp[default,curl-cffi]" yt-dlp-ejs gallery-dl
      - run: python src/make.py app/mo_downloader.py
      - run: python tests/run_tests.py

  extension-tests:
    # the browser extension inside an automated Chromium (tests/ext_test.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python -m pip install --quiet "yt-dlp[default,curl-cffi]" yt-dlp-ejs gallery-dl playwright
      - run: python -m playwright install --with-deps chromium
      - run: python src/make.py app/mo_downloader.py
      - run: python tests/ext_test.py
