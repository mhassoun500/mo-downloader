<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1d1b16;--muted:#6b665b;--line:#e3ddcf;--accent:#0f6b5c;--soft:#dcefe9;--bad:#b3261e;--chip:#efe9dc}
  @media (prefers-color-scheme: dark){:root{--bg:#14130f;--panel:#1d1b16;--ink:#ece7dc;--muted:#a39d8f;--line:#332f27;--accent:#3fb59c;--soft:#1d332d;--bad:#ef7b72;--chip:#2a2720}}
  *{box-sizing:border-box}
  body{margin:0;width:330px;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header img{width:28px;height:28px;border-radius:7px}
  header b{font-size:16px;direction:ltr} header b span{color:var(--accent)}
  .dot{margin-inline-start:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .dot i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.on i{background:#2fa36b} .dot.off i{background:var(--bad)}
  main{padding:12px 14px}
  .page{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 10px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;grid-column:1/-1}
  button:disabled{opacity:.45;cursor:default}
  .wide{grid-column:1/-1}
  .msg{margin-top:10px;padding:8px 10px;border-radius:9px;font-size:13px;display:none}
  .msg.ok{display:block;background:var(--soft);color:var(--accent)} .msg.err{display:block;background:#f6e0dd;color:var(--bad)}
  @media (prefers-color-scheme: dark){.msg.err{background:#3a1f1c}}
  h4{margin:14px 0 6px;font-size:13px;color:var(--muted)}
  .job{padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
  .job:first-of-type{border-top:0}
  .job .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .job .s{color:var(--muted)}
  .bar{height:4px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent);width:0}
  footer{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}
  footer a{color:var(--accent);cursor:pointer;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <b>MO <span>Downloader</span></b>
  <span class="dot" id="dot"><i></i><span id="dotText">…</span></span>
</header>
<main>
  <div class="page" id="page">—</div>
  <div class="grid">
    <button class="primary" data-p="best">⚡ تنزيل بأفضل جودة</button>
    <button data-p="1080">1080p</button>
    <button data-p="720">720p</button>
    <button data-p="480">480p</button>
    <button data-p="audio">🎵 صوت MP3</button>
    <button class="wide" id="choose">اختيار الجودة بالتفصيل…</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="jobsBox" style="display:none"><h4>آخر التنزيلات</h4><div id="jobs"></div></div>
</main>
<footer>
  <a id="open">فتح MO Downloader</a>
  <a id="launch" style="display:none">تشغيل البرنامج</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
